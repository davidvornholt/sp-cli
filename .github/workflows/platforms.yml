name: Platforms

# Tests sp and installs it from source on each OS it supports. macOS and
# Windows can't be checked locally, so this also runs on draft pull requests,
# where those platforms get tested before review. It isn't a required check.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  install:
    name: install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run --filter @sp-cli/cli test

      # USERPROFILE is where Windows finds the home directory.
      - name: Install for a temporary user
        run: |
          set -euo pipefail
          home="$RUNNER_TEMP/home"
          mkdir -p "$home"
          HOME="$home" USERPROFILE="$home" bun run --filter @sp-cli/cli install:user

      - name: Check the installed command and skills
        run: |
          set -euo pipefail
          home="$RUNNER_TEMP/home"
          executable=sp
          if [[ "$RUNNER_OS" == Windows ]]; then
            executable=sp.exe
          fi
          "$home/.local/bin/$executable" --help
          for skill in apps/cli/skills/*/; do
            diff -r "$skill" "$home/.agents/skills/$(basename "$skill")"
          done
