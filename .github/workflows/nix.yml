name: Nix

# This build is required because Standards auto-merge waits only for required
# checks and `check` doesn't build this package, so a Dependabot update would
# otherwise land with a stale hash.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Build
        run: nix build .#default -L

      - name: Check the command and skills
        run: |
          set -euo pipefail
          result/bin/sp --help
          for skill in apps/cli/skills/*/; do
            diff -r "$skill" "result/share/sp-cli/skills/$(basename "$skill")"
          done
